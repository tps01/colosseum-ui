[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-ui"
version = "0.1.0"
description = "Optional Colosseum desktop runner and inspector"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["colosseum-core>=0.18.8,<0.19", "PySide6-Essentials>=6.10,<7"]

[project.gui-scripts]
colosseum-ui = "colosseum_ui.app:main"

[tool.setuptools.packages.find]
include = ["colosseum_ui*"]

[tool.setuptools.package-data]
colosseum_ui = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
