[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-extensions"
version = "0.4.0"
description = "Optional extensions for Colosseum, including the desktop runner"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "colosseum-core>=0.18.11,<0.19",
  # Qt 6.12 aborts while populating large trees on Python 3.10 (Linux CI).
  "PySide6-Essentials>=6.9.3,<6.12; python_version < '3.11'",
  "PySide6-Essentials>=6.9.3,<7; python_version >= '3.11'",
]

[project.gui-scripts]
colosseum-extensions = "colosseum_extensions.ui.app:main"

[tool.setuptools.packages.find]
include = ["colosseum_extensions*"]

[tool.setuptools.package-data]
"colosseum_extensions.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
